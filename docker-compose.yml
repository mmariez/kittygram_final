services:
  db:
    image: postgres:13
    container_name: db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: kittygram_backend:latest
    container_name: backend
    env_file: .env
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi"

  frontend:
    build: ./frontend
    image: kittygram_frontend:latest
    container_name: frontend
    volumes:
      - static:/staticfiles

  gateway:
    build: ./nginx
    image: kittygram_gateway:latest    # добавляем имя образа
    container_name: gateway
    ports:
      - "8000:80"
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend